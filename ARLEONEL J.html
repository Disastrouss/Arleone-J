  --ink:#000; --pearl:#f3ede2; --muted:#a69c90; --rose:#d4a77f;
  --hair:rgba(239,233,221,.14);
  --foil:linear-gradient(110deg,#8d6a49 0%,#e9cfa6 28%,#fff3dc 44%,#c99a6e 62%,#8d6a49 100%);
  --display:'Italiana','Didot','Bodoni 72',Georgia,serif;
  --sans:'Albert Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{
  min-height:100vh;font-family:var(--sans);color:var(--pearl);-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 50% at 50% 20%,#1c130a 0%,#000 68%);
  display:flex;justify-content:center;position:relative;overflow-x:hidden;
}
/* marca de agua: el loto gigante detrás de todo */
body::before{
  content:"";position:fixed;left:50%;top:46%;width:150vmax;max-width:1500px;aspect-ratio:689/424;
  transform:translate(-50%,-50%);background:var(--pearl);opacity:.035;pointer-events:none;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
}
main{position:relative;width:100%;max-width:440px;padding:calc(36px + env(safe-area-inset-top,0px)) 26px calc(130px + env(safe-area-inset-bottom,0px))}

/* hero */
.hero{text-align:center;padding-top:8px}
.glow{position:relative;display:grid;place-items:center}
.glow::before{content:"";position:absolute;inset:-35% -20%;background:radial-gradient(closest-side,rgba(233,190,140,.34),rgba(212,167,127,.08) 55%,transparent 72%);animation:pulse 4.5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.06)}}
.disc{
  position:relative;width:min(76vw,310px);aspect-ratio:1;border-radius:50%;padding:4px;
  background:var(--foil);background-size:260% 100%;animation:shine 6s ease-in-out infinite alternate;
  box-shadow:0 0 0 8px rgba(212,167,127,.07),0 0 60px rgba(233,190,140,.30),0 24px 50px rgba(0,0,0,.7);
}
.disc-in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,#21170d 0%,#080605 62%,#000 100%)}
.foto{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.sp{z-index:2;position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3dc;box-shadow:0 0 9px 3px rgba(255,236,200,.85);opacity:0;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.5)}}
.lotus{
  position:relative;width:76%;filter:drop-shadow(0 0 22px rgba(233,190,140,.35));aspect-ratio:689/424;background:var(--foil);background-size:260% 100%;background-position:100% 0;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  animation:sweep 3.4s cubic-bezier(.3,.6,.2,1) .2s both,shine 6s ease-in-out 3.6s infinite alternate;
}
@keyframes shine{from{background-position:18% 0}to{background-position:70% 0}}
@keyframes sweep{from{background-position:100% 0;opacity:.15}35%{opacity:1}to{background-position:18% 0;opacity:1}}
h1{margin-top:24px;font-family:var(--display);font-weight:400;font-size:3.3rem;line-height:1;letter-spacing:.2em;padding-left:.2em}
.sub{margin-top:12px;font-size:.95rem;font-weight:300;letter-spacing:.14em;color:var(--rose)}
.phrase{margin-top:22px;font-size:.98rem;font-weight:300;color:var(--muted);line-height:1.5}

/* listas */
h2{font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.06em;margin:52px 0 6px}
.list{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--hair)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:400;font-size:1.02rem}
.row span{display:block;margin-top:3px;font-size:.88rem;font-weight:300;color:var(--muted);letter-spacing:.04em}
.ib{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--pearl);
  border:1px solid var(--hair);background:rgba(255,255,255,.02);text-decoration:none;transition:border-color .25s,color .25s,background .25s;cursor:pointer;font:inherit
}
.ib:hover{border-color:var(--rose);color:var(--rose)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib.wa:hover{background:rgba(212,167,127,.1)}
a:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.link{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--hair);color:var(--pearl);text-decoration:none;font-size:1.02rem}
.link .ib{width:40px;height:40px}
.link:hover .ib{border-color:var(--rose);color:var(--rose)}

/* dock inferior */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 32px);max-width:408px;display:flex;gap:8px;padding:8px;border-radius:999px;z-index:5;
  background:rgba(0,0,0,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(239,233,221,.16);box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.dock button{
  flex:1;height:50px;border-radius:999px;border:0;font:inherit;font-size:.95rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .2s;
}
.dock button:active{transform:scale(.97)}
.ghost{background:transparent;color:var(--pearl);box-shadow:inset 0 0 0 1px var(--hair)}
.solid{background:var(--foil);background-size:220% 100%;background-position:30% 0;color:#1d1408}

/* hoja de datos bancarios */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:10;width:100%;max-width:440px;max-height:92vh;overflow:auto;
  transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(#141211,#050404);border:1px solid var(--hair);border-bottom:0;border-radius:28px 28px 0 0;
  padding:12px 22px calc(28px + env(safe-area-inset-bottom,0px));
}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--hair);margin:0 auto 18px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.05em}
.seg{display:flex;margin:18px 0;padding:4px;border-radius:999px;border:1px solid var(--hair)}
.seg button{flex:1;height:40px;border:0;border-radius:999px;background:none;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--pearl);color:#0a0a0a;font-weight:500}
.plate{
  position:relative;overflow:hidden;border-radius:20px;aspect-ratio:1.586;padding:22px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(145deg,#26201a 0%,#0e0c0a 55%,#000 100%);border:1px solid rgba(233,207,166,.35);
  box-shadow:0 20px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,243,220,.18);
}
.plate::before{
  content:"";position:absolute;right:-12%;bottom:-18%;width:78%;aspect-ratio:689/424;background:var(--foil);opacity:.30;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
}
.plate>*{position:relative}
.plate .k{font-size:.88rem;font-weight:300;color:var(--rose);letter-spacing:.06em}
.plate .n{font-family:var(--display);font-size:1.5rem;letter-spacing:.06em;margin-top:4px}
.plate .c{font-size:1.28rem;font-weight:300;letter-spacing:.12em;font-variant-numeric:tabular-nums;word-break:break-all}
.plate .o{font-size:.84rem;font-weight:300;color:var(--muted);letter-spacing:.04em}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.f small{display:block;font-size:.8rem;font-weight:300;color:var(--muted)}
.f div{font-size:.98rem;word-break:break-word}
.cp{flex:none;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--hair);background:none;color:var(--pearl);font:inherit;font-size:.85rem;cursor:pointer;transition:all .25s}
.cp:hover{border-color:var(--rose);color:var(--rose)}
.cp.ok{background:var(--rose);border-color:var(--rose);color:#1d1408}
.x{position:absolute;right:16px;top:14px;width:38px;height:38px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lotus,.disc{background-position:18% 0}}
</style>
</head>
<body>

$('phones').innerHTML = DATA.telefonos.map(t => `
  <div class="row">
    <div class="t"><b>${esc(t.etiqueta)}</b><span>${fmt(t.numero)}</span></div>
    <a class="ib" href="tel:+${t.numero}" aria-label="Llamar a ${esc(t.etiqueta)}"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></a>
    <a class="ib wa" href="https://wa.me/${t.numero}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp a ${esc(t.etiqueta)}"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.6A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4-1L3 21z"/></svg></a>
  </div>`).join('');

$('links').innerHTML = DATA.enlaces.map(l => `
  <a class="link" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ib"><svg viewBox="0 0 24 24">${l.i}</svg></span>${esc(l.texto)}</a>`).join('') +
  `<a class="link" href="mailto:${esc(DATA.correo)}"><span class="ib"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>${esc(DATA.correo)}</a>`;

/* hoja bancaria */
let cur = 0, opener = null;
function drawAcct(){
  const c = DATA.cuentas[cur];
  $('seg').innerHTML = DATA.cuentas.map((a,i) => `<button type="button" data-i="${i}" aria-pressed="${i===cur}">${esc(a.titulo)}</button>`).join('');
  $('acct').innerHTML = `
    <div class="plate">
      <div><div class="k">${esc(c.nota)}</div><div class="n">${esc(c.titulo)}</div></div>
      <div><div class="c">${grp(c.clabe)}</div><div class="o">${esc(c.banco)}, ${esc(c.titular)}</div></div>
    </div>
    ${[['CLABE',c.clabe],['Banco',c.banco],['Titular',c.titular]].map(([k,v]) => `
    <div class="f"><div><small>${k}</small>${esc(v)}</div><button class="cp" type="button" data-copy="${esc(v)}">Copiar</button></div>`).join('')}`;
}
function openSheet(){ opener = document.activeElement; drawAcct(); $('scrim').classList.add('on'); $('sheet').classList.add('on'); $('sheet').focus(); }
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); if(opener) opener.focus(); }
$('bank').onclick = openSheet; $('close').onclick = closeSheet; $('scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ cur = +b.dataset.i; drawAcct(); } });
$('acct').addEventListener('click', async e => {
  const b = e.target.closest('.cp'); if(!b) return;
  const t = b.dataset.copy;
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  b.textContent = 'Copiado'; b.classList.add('ok');
  setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1700);
});

/* guardar contacto */
$('save').onclick = () => {
  const v = ['BEGIN:VCARD','VERSION:3.0',`FN:${DATA.nombre} ${DATA.giro}`,`ORG:${DATA.nombre}`,`TITLE:${DATA.giro}`];
  DATA.telefonos.forEach(t => v.push(`TEL;TYPE=CELL:+${t.numero}`));
  v.push(`EMAIL:${DATA.correo}`,'END:VCARD');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v.join('\r\n')], {type:'text/vcard'}));
  a.download = `${DATA.nombre}.vcf`; document.body.appendChild(a); a.click(); a.remove();
};
</script>
